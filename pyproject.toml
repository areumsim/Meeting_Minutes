[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes"
# 버전 리터럴은 meeting_minutes_app/__init__.py 한 곳 — 여기 하드코딩하면 두 값이
# 갈라진다. 정본 배포본(포터블)에는 pyproject.toml 이 없어 코드가 여기를 읽을 수 없으므로
# 방향은 반드시 코드 → pyproject 다. 읽을 때는 common/version.py 의 app_version().
dynamic = ["version"]
description = "Obsidian 기반 회의록 자동화 + LLM Wiki 지식 순환 시스템 (사내 배포용)"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.107.1,<3",
    "httpx~=0.27",
    "anthropic~=0.30",
    # OpenAI SDK 2.x Realtime 수신은 Connection.recv(decode=False)를 사용한다.
    # 해당 sync API는 websockets 14부터 제공되며, OpenAI 공식 상한은 <16이다.
    "websockets>=14,<16",
    "sounddevice~=0.4.6",
    "numpy~=1.24",
    "requests~=2.31",
    "watchdog>=4.0",
    "fastapi~=0.110",
    "uvicorn[standard]~=0.29",
    "python-multipart~=0.0.9",
    "pydantic~=2.0",
    # fastmcp 는 원격 MCP 서버(/mcp) 전용이다. 포터블 배포본(build_portable.ps1 /
    # requirements-web.txt)은 임베디드 파이썬의 pywin32 재배치 문제로 fastmcp 를 의도적으로
    # 제외하며, 이 경우 /mcp 만 비활성화되고 나머지 기능은 정상 동작한다. 개발환경(pip install
    # -e .)에서는 설치돼 tests/test_mcp_server.py 도 수집된다. (미설치 시 해당 테스트만 스킵)
    "fastmcp~=3.4",
]

[project.optional-dependencies]
dev = ["pytest~=8.0"]
# 짧은 발화 응답성 개선용 VAD 모드 (선택). Windows/기타 OS 휠이 달라 마커로 분기.
vad = [
    "webrtcvad-wheels~=2.0; sys_platform == 'win32'",
    "webrtcvad~=2.0.10; sys_platform != 'win32'",
]

[project.scripts]
meeting-minutes = "meeting_minutes_app.cli:main"

[tool.setuptools.dynamic]
version = {attr = "meeting_minutes_app.__version__"}

[tool.setuptools.packages.find]
include = ["meeting_minutes_app*", "web*"]
exclude = ["tests*", "scripts*"]
