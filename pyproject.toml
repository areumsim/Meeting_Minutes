[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes"
version = "0.1.0"
description = "Obsidian 기반 회의록 자동화 + LLM Wiki 지식 순환 시스템 (사내 배포용)"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "openai~=1.30",
    "httpx~=0.27",
    "anthropic~=0.30",
    "websockets~=13.0",
    "sounddevice~=0.4.6",
    "numpy~=1.24",
    "requests~=2.31",
    "watchdog~=4.0",
    "fastapi~=0.110",
    "uvicorn[standard]~=0.29",
    "python-multipart~=0.0.9",
    "pydantic~=2.0",
    "fastmcp~=3.4",
]

[project.optional-dependencies]
dev = ["pytest~=8.0"]
# 짧은 발화 응답성 개선용 VAD 모드 (선택). Windows/기타 OS 휠이 달라 마커로 분기.
vad = [
    "webrtcvad-wheels~=2.0; sys_platform == 'win32'",
    "webrtcvad~=2.0.10; sys_platform != 'win32'",
]

[project.scripts]
meeting-minutes = "meeting_minutes_app.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_minutes_app*", "web*"]
exclude = ["tests*", "scripts*"]
