<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 핀치줌을 막지 않는다(WCAG 1.4.4). maximum-scale=1 + user-scalable=no 는
         iOS Safari 는 무시하지만 Capacitor WebView·안드로이드는 그대로 따라서,
         저시력 사용자가 10~12px 한글을 확대할 방법이 없었다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 외부 폰트(Google Fonts) 의존 제거 — 오프라인/사내망에서도 로딩 지연·실패 없이
         시스템 폰트로 동작한다(비개발자 배포 exe 전제). -->
    <!-- CSP 는 빌드 프로파일이 주입한다(vite.config.ts 의 cspPlugin).
         packaged(PC 배포본, 기본)   = connect-src 'self' — 외부 호출은 백엔드를 지난다.
         standalone(아이폰 앱 번들) = OpenAI 직접 + 사용자가 입력한 LAN 주소까지 허용.
         한 개의 CSP 로 둘을 덮으려니 임의 호스트가 열려 있었다(SEC-006).
         자리표시자가 없으면 플러그인이 빌드를 실패시킨다 — CSP 가 조용히 빠지는 것을 막는다. -->
    <meta http-equiv="Content-Security-Policy" content="%MM_CSP%" />
    <title>AI Minutes</title>
    <!-- 파비콘은 data URI 로 인라인한다 — 외부 요청이 0이라 좁혀 둔 CSP 와 오프라인 배포
         정책을 둘 다 지키고, 별도 자산 파일을 번들에 넣지 않아도 된다.
         마크는 로고와 같은 중립 색에 액센트 링 하나(PRD §5.1 브랜드 마크). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1a17'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%230d9488' stroke-width='2.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
